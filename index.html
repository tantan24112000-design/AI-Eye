<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mắt AI – Trợ lý quan sát xung quanh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEF2;--ink:#0F1B26;--panel:#fff;--line:#CBD5DD;--accent:#1F5EFF;--on:#fff;--muted:#586878;--bub:#DCE6FF;--warn:#B4531A}
@media(prefers-color-scheme:dark){:root{--bg:#0E1620;--ink:#E7EEF5;--panel:#16212D;--line:#2A3A4A;--accent:#6E9BFF;--on:#0E1620;--muted:#93A4B5;--bub:#1E3157;--warn:#F0A168}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0)}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 0}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.chip.on{color:var(--accent);border-color:var(--accent)}
.cam{position:relative;aspect-ratio:4/3;background:#0a1118;border-radius:18px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
#ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;color:#9fb0c0}
[hidden]{display:none!important}
.c{position:absolute;width:26px;height:26px;border:3px solid rgba(255,255,255,.85)}
.a{top:12px;left:12px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.b{top:12px;right:12px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.e{bottom:12px;left:12px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.d{bottom:12px;right:12px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.looking .c{border-color:var(--accent)}
button{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:500}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;margin:10px 0}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin-bottom:12px;align-items:center}
select{font:inherit;font-size:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 4px}
#log{display:flex;flex-direction:column;gap:10px;padding-bottom:170px}
.m{max-width:92%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--bub)}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.err{align-self:stretch;max-width:100%;color:var(--warn);border:1px solid var(--warn);background:transparent}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.dock>div{max-width:640px;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.chips button{white-space:nowrap;min-height:34px;padding:4px 12px;font-size:14px;border-radius:99px}
.bar{display:flex;gap:8px}
.bar input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Mắt AI</h1><span id="st" class="chip">Camera tắt</span></header>
  <section class="cam" id="cam">
    <video id="v" autoplay playsinline muted></video>
    <i class="c a"></i><i class="c b"></i><i class="c e"></i><i class="c d"></i>
    <div id="ph"><span id="phmsg">Đang xin quyền truy cập camera…</span><button id="allow" class="pri" hidden>Cho phép camera</button></div>
  </section>
  <div class="row">
    <button id="on" class="pri">Bật camera</button>
    <button id="scan" disabled>Phân tích xung quanh</button>
    <button id="flip" disabled>Đổi</button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="auto"> Tự phân tích mỗi
      <select id="every"><option value="20">20 giây</option><option value="30" selected>30 giây</option><option value="60">60 giây</option></select></label>
    <label><input type="checkbox" id="tts"> Đọc to</label>
  </div>
  <section id="log" aria-live="polite"></section>
</div>
<div class="dock"><div>
  <div class="chips" id="chips">
    <button>Đây là vật gì?</button><button>Có gì nguy hiểm không?</button><button>Nên sắp xếp lại thế nào?</button><button>Tôi nên làm gì tiếp theo?</button>
  </div>
  <div class="bar"><button id="mic">Nói</button><input id="q" placeholder="Hỏi về những gì AI đang thấy…" autocomplete="off"><button id="send" class="pri">Gửi</button></div>
  <div class="meta" id="meta"></div>
</div></div>

<script>
// ⚠️ Key nằm trong mã nguồn: ai có file này đều thấy được. Đừng đăng công khai.
const API_KEY = "AQ.Ab8RN6LLQfj_Jm10Cl77tSPAj21AlrjB2aRUM1LiO9_VYUd4vw";
// Thử lần lượt: nếu model đầu hết quota/quá tải thì tự chuyển sang model kế tiếp.
const MODELS = ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"];
const BASE = "https://generativelanguage.googleapis.com/v1beta/models/";
const BUDGET = 300000;   // ngân sách token tự đặt cho mỗi phiên (tự tắt chế độ tự động khi chạm mức này)

const SYS = "Bạn là trợ lý quan sát qua camera điện thoại. Luôn trả lời bằng tiếng Việt, ngắn gọn, thực tế, dưới 200 từ trừ khi được yêu cầu chi tiết. Câu trả lời dựa trên ảnh mới nhất. Nếu ảnh mờ hoặc thiếu sáng, nói thẳng và gợi ý cách chụp lại. Không đoán danh tính người. Cảnh báo ngay nếu thấy nguy cơ an toàn.";
const SCAN_Q = "Phân tích khung cảnh trước camera: nêu các vật hoặc người chính, điều cần lưu ý (an toàn, bất tiện), rồi đưa 2–4 lời khuyên cụ thể.";
const AUTO_Q = "Cập nhật nhanh (tối đa 60 từ): có gì mới hoặc đáng chú ý trong khung cảnh, kèm 1 lời khuyên.";

const $ = s => document.querySelector(s);
const v = $("#v"), log = $("#log");
const cv = document.createElement("canvas");
const sc = Object.assign(document.createElement("canvas"), {width: 16, height: 16});
let stream = null, facing = "environment", busy = false, used = 0, prevSig = null, timer = null;
const pairs = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const md = t => t.replace(/[&<>]/g, m => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[m])).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^[*-] /gm, "• ");

function say(cls, t) {
  const d = document.createElement("div");
  d.className = "m " + cls; d.innerHTML = md(t);
  log.append(d); d.scrollIntoView({block: "end", behavior: "smooth"});
  return d;
}
function meter(model) {
  $("#meta").textContent = "Token phiên này: " + used.toLocaleString("vi-VN") + " / " + BUDGET.toLocaleString("vi-VN") + (model ? " · " + model : "");
}
function setBusy(b) {
  busy = b; $("#scan").disabled = b || !stream; $("#send").disabled = b;
  $("#cam").classList.toggle("looking", b);
}
function ui(on) {
  $("#on").textContent = on ? "Tắt camera" : "Bật camera";
  $("#st").textContent = on ? "Camera đang bật" : "Camera tắt";
  $("#st").classList.toggle("on", on);
  $("#ph").hidden = on; $("#scan").disabled = !on || busy; $("#flip").disabled = !on;
  schedule();
}

const BAD_UA = /FBAN|FBAV|Zalo|Instagram|Messenger|Line\/|MicroMessenger/i.test(navigator.userAgent);
let starting = false;
function showPh(msg, btn) { $("#ph").hidden = false; $("#phmsg").textContent = msg; $("#allow").hidden = !btn; }
async function getStream() {
  const tries = [{video: {facingMode: {ideal: facing}, width: {ideal: 1280}}, audio: false}, {video: true, audio: false}];
  let last;
  for (const c of tries) {
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch (e) { last = e; if (e.name === "NotAllowedError" || e.name === "SecurityError") break; }
  }
  throw last;
}
async function startCam() {
  if (starting) return;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showPh(BAD_UA ? "Trình duyệt trong ứng dụng (Zalo, Messenger, Facebook…) chặn camera. Hãy mở link bằng Chrome hoặc Safari." : "Camera chỉ chạy khi trang mở bằng HTTPS (không phải file tải về). Hãy đưa file lên hosting HTTPS rồi mở link bằng Chrome hoặc Safari.", false);
    return;
  }
  starting = true;
  stopCam();
  showPh("Đang xin quyền truy cập camera… Hãy chọn “Cho phép” khi trình duyệt hỏi.", false);
  try {
    stream = await getStream();
    v.srcObject = stream; v.muted = true; await v.play(); ui(true);
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; ui(false);
    showPh(e.name === "NotAllowedError" ? "Chưa có quyền camera. Chạm “Cho phép camera” để hỏi lại. Nếu không hiện hộp thoại, hãy bật Camera cho trang này trong cài đặt trình duyệt." : "Không mở được camera: " + e.message, true);
  } finally { starting = false; }
}
function stopCam() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; v.srcObject = null; ui(false); }

// Thu nhỏ ảnh còn tối đa 768px để tiết kiệm token
function frame() {
  const w = v.videoWidth, h = v.videoHeight; if (!w) return null;
  const s = Math.min(1, 768 / Math.max(w, h));
  cv.width = Math.round(w * s); cv.height = Math.round(h * s);
  cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", .72).split(",")[1];
}
function sig() {
  const x = sc.getContext("2d", {willReadFrequently: true}); x.drawImage(v, 0, 0, 16, 16);
  const d = x.getImageData(0, 0, 16, 16).data, a = [];
  for (let i = 0; i < d.length; i += 4) a.push((d[i] + d[i + 1] + d[i + 2]) / 3);
  return a;
}

async function post(model, body) {
  const r = await fetch(BASE + model + ":generateContent", {
    method: "POST", headers: {"Content-Type": "application/json", "x-goog-api-key": API_KEY}, body: JSON.stringify(body)
  });
  return {s: r.status, j: await r.json().catch(() => ({}))};
}

// Gọi Gemini: tự đổi model khi lỗi, tự nối tiếp nếu câu trả lời bị cắt giữa chừng (MAX_TOKENS)
async function gen(contents) {
  let err = "";
  for (const m of MODELS) {
    const cfg = {maxOutputTokens: 4096, thinkingConfig: {thinkingLevel: "low"}};
    let text = "", tok = 0, msgs = contents, part = 0, tries = 0;
    while (part < 4 && tries < 4) {
      const {s, j} = await post(m, {systemInstruction: {parts: [{text: SYS}]}, contents: msgs, generationConfig: cfg});
      if (s !== 200) {
        const em = (j.error && j.error.message) || ("HTTP " + s);
        err = m + ": " + em;
        if (s === 400 && cfg.thinkingConfig) { delete cfg.thinkingConfig; tries++; continue; }
        if (s === 401 || s === 403) throw new Error("Key bị từ chối (" + s + "): " + em + ". Hãy tạo key mới trong Google AI Studio và dán lại vào đầu file.");
        if ((s === 429 || s >= 500) && tries++ < 1) { await sleep(1500); continue; }
        break;
      }
      const c = (j.candidates || [])[0] || {};
      tok += (j.usageMetadata && j.usageMetadata.totalTokenCount) || 0;
      const t = ((c.content && c.content.parts) || []).filter(p => p.text && !p.thought).map(p => p.text).join("");
      text += t;
      if (c.finishReason === "MAX_TOKENS" && t) {
        part++;
        msgs = [...msgs, {role: "model", parts: [{text: t}]}, {role: "user", parts: [{text: "Tiếp tục ngay từ chỗ bị dừng, không lặp lại."}]}];
        continue;
      }
      if (!text) { err = m + ": " + (c.finishReason || (j.promptFeedback && j.promptFeedback.blockReason) || "phản hồi rỗng"); break; }
      return {text, tok, model: m};
    }
    if (text) return {text, tok, model: m};
  }
  throw new Error("Không nhận được câu trả lời. " + err);
}

async function ask(q, auto) {
  if (busy) return;
  const img = frame();
  if (!img) { say("err", "Hãy bật camera trước khi hỏi."); return; }
  setBusy(true);
  if (!auto) say("me", q === SCAN_Q ? "Phân tích xung quanh" : q);
  const wait = say("ai", auto ? "Đang cập nhật…" : "Đang nhìn…");
  prevSig = sig();
  const hist = pairs.slice(-3).flatMap(p => [{role: "user", parts: [{text: p[0]}]}, {role: "model", parts: [{text: p[1]}]}]);
  try {
    const r = await gen([...hist, {role: "user", parts: [{inlineData: {mimeType: "image/jpeg", data: img}}, {text: q}]}]);
    wait.innerHTML = md(r.text); pairs.push([q, r.text]); used += r.tok; meter(r.model); speak(r.text);
  } catch (e) { wait.className = "m err"; wait.textContent = e.message; }
  finally { setBusy(false); }
}

function speak(t) {
  if (!$("#tts").checked || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/\*\*/g, "")); u.lang = "vi-VN"; speechSynthesis.speak(u);
}

// Tự phân tích: chỉ gọi AI khi khung hình thay đổi rõ rệt và còn trong ngân sách token
function schedule() { clearInterval(timer); if ($("#auto").checked && stream) timer = setInterval(tick, +$("#every").value * 1000); }
function tick() {
  if (busy || document.hidden || !stream || !v.videoWidth) return;
  if (used >= BUDGET) { $("#auto").checked = false; schedule(); say("err", "Đã chạm ngân sách token của phiên. Chế độ tự phân tích đã tắt, bạn vẫn có thể hỏi thủ công."); return; }
  const s = sig();
  if (prevSig) { let d = 0; for (let i = 0; i < s.length; i++) d += Math.abs(s[i] - prevSig[i]); if (d / s.length < 6) return; }
  ask(AUTO_Q, true);
}

function send() { const q = $("#q").value.trim(); if (!q) return; $("#q").value = ""; ask(q); }
$("#on").onclick = () => stream ? stopCam() : startCam();
$("#allow").onclick = startCam;
$("#flip").onclick = () => { facing = facing === "environment" ? "user" : "environment"; startCam(); };
$("#scan").onclick = () => ask(SCAN_Q);
$("#send").onclick = send;
$("#q").onkeydown = e => { if (e.key === "Enter") send(); };
$("#auto").onchange = $("#every").onchange = schedule;
document.querySelectorAll("#chips button").forEach(b => b.onclick = () => ask(b.textContent));
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $("#mic").hidden = true;
else $("#mic").onclick = () => { const r = new SR(); r.lang = "vi-VN"; r.onresult = e => { $("#q").value = e.results[0][0].transcript; send(); }; r.start(); };
meter();
// Tự xin quyền camera ngay khi mở trang
startCam();
// Nếu người dùng bật quyền trong cài đặt sau đó, tự mở camera luôn
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({name: "camera"}).then(p => {
    p.onchange = () => { if (p.state === "granted" && !stream) startCam(); };
  }).catch(() => {});
}
</script>
</body>
</html>
